id: dvaa-securebot
name: DVAA SecureBot
target_type: ai_agent
interface:
  type: http
  adapter: generic_http
  config:
    url: http://127.0.0.1:7001/v1/chat/completions
    method: POST
    body:
      model: securebot
      messages:
        - role: user
          content: "{{input}}"
    response:
      text_path: choices.0.message.content
capabilities: [chat]
observability: [response]
credential_refs: []
metadata:
  environment: local
  platform: dvaa
  agent: securebot
