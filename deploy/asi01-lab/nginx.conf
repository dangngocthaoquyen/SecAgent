worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    upstream researchbot { server 172.30.77.2:7015; }
    server {
        # Do not listen on the internal lab interface or wildcard addresses.
        listen 172.30.78.2:8080;
        server_name _;
        client_max_body_size 128k;
        if ($args != "") { return 400; }
        proxy_http_version 1.1;
        proxy_set_header Host researchbot;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
        proxy_redirect off;
        location = /health {
            limit_except GET { deny all; }
            proxy_pass http://researchbot/health;
        }
        location = /v1/chat/completions {
            limit_except POST { deny all; }
            proxy_pass http://researchbot/v1/chat/completions;
        }
        location / { return 404; }
    }
}
