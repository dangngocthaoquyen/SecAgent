name: SecAgent Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Check tracked Python cache files
        run: |
          bad_files="$(git ls-files | grep -E '(__pycache__/|\.pyc$|\.pytest_cache/|\.pytest_tmp/)' || true)"

          if [ -n "$bad_files" ]; then
            echo "ERROR: Generated/cache files are tracked by Git:"
            echo "$bad_files"
            exit 1
          fi

          echo "No tracked Python cache files."

      - name: Check legacy src imports
        run: |
          bad_imports="$(grep -RInE 'from src\.|import src\.' backend/src backend/tests || true)"

          if [ -n "$bad_imports" ]; then
            echo "ERROR: Legacy 'src.*' imports found:"
            echo "$bad_imports"
            exit 1
          fi

          echo "No legacy src imports."

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/src
        run: |
          python -m pytest tests -q -p no:cacheprovider